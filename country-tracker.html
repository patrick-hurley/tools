<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Visit Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .country-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        .flag {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        .country-name {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .visited {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .not-visited {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .counter {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2em;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .percentage {
            font-size: 1.5em;
            color: #764ba2;
            margin: 20px 0;
            font-weight: 600;
        }

        .reset-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

        <h1>🌍 Country Visit Tracker</h1>

        <div id="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="counter" id="counter">Country 1 of 195</div>
        </div>

        <div id="country-container">
            <div class="country-card">

                <div class="country-name" id="country-name">Afghanistan</div>
                <div class="buttons">
                    <button class="visited" onclick="markCountry(true)">✈️ Visited</button>
                    <button class="not-visited" onclick="markCountry(false)">❌ Not Visited</button>
                </div>
            </div>
        </div>

        <div id="results" class="results" style="display: none;">
            <h2>🎉 Your Travel Results!</h2>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="visited-count">0</div>
                    <div class="stat-label">Countries Visited</div>

                <div class="stat-card">

            </div>
            <div class="percentage" id="percentage">0% of the world explored!</div>
            <button class="reset-btn" onclick="resetTracker()">Start Over</button>
        </div>
    </div>

            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function markCountry(visited) {
            responses.push({
                country: countries[currentCountryIndex].name,
                visited: visited
            });

            if (visited) {
                visitedCount++;
            } else {
                notVisitedCount++;
            }

            currentCountryIndex++;

            if (currentCountryIndex < countries.length) {
                updateDisplay();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('country-container').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            document.getElementById('not-visited-count').textContent = notVisitedCount;

            const percentage = Math.round((visitedCount / countries.length) * 100);
            document.getElementById('percentage').textContent = `${percentage}% of the world explored!`;
        }

            currentCountryIndex = 0;
            visitedCount = 0;
            notVisitedCount = 0;
            responses = [];

            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('country-container').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            updateDisplay();
